<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF N-up Master - Final Fix</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f1f5f9; --card: #ffffff; }
        body { font-family: sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .app-container { max-width: 1200px; width: 100%; display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .control-panel { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: fit-content; }
        .preview-panel { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; min-height: 700px; }
        
        h1 { font-size: 18px; margin: 0 0 20px 0; color: #1e293b; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        
        .btn-main { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 6px; width: 100%; font-weight: 700; cursor: pointer; font-size: 15px; margin-top: 10px; }
        .btn-main:disabled { background: #94a3b8; }

        #previewCanvas { background: white; border: 1px dotted #94a3b8; max-width: 100%; height: auto; }
        .status-msg { margin-top: 10px; font-size: 12px; color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="control-panel">
        <h1>📑 PDF 모아찍기 설정</h1>
        
        <div class="form-group">
            <label>1. PDF 파일 선택</label>
            <input type="file" id="pdfInput" accept="application/pdf">
        </div>

        <div class="form-group">
            <label>2. 용지 선택</label>
            <select id="pageSize" onchange="resetAndPreview()">
                <option value="B4" selected>B4 (257x364mm)</option>
                <option value="A4">A4 (210x297mm)</option>
            </select>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>3. 가로(a)</label>
                <input type="number" id="cols" value="3" min="1" oninput="resetAndPreview()">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>4. 세로(b)</label>
                <input type="number" id="rows" value="6" min="1" oninput="resetAndPreview()">
            </div>
        </div>

        <div class="form-group">
            <label>5. 배치 순서</label>
            <select id="direction" onchange="resetAndPreview()">
                <option value="horizontal">가로 방향 (→)</option>
                <option value="vertical">세로 방향 (↓)</option>
            </select>
        </div>

        <button class="btn-main" id="generateBtn" onclick="generatePdf()">PDF 다운로드</button>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="preview-panel">
        <label style="align-self: flex-start;">실시간 미리보기 (첫 장 배치도)</label>
        <canvas id="previewCanvas"></canvas>
    </div>
</div>

<script>
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const SIZES = {
        'A4': { pt: [595.28, 841.89] },
        'B4': { pt: [728.50, 1031.81] }
    };

    let masterBuffer = null; // 원본 데이터를 담는 변수
    let pageThumbnails = []; // 미리보기 이미지들
    let isProcessing = false;

    // 설정 변경 시 호출: 기존 미리보기를 싹 비우고 다시 그림
    async function resetAndPreview() {
        if (!masterBuffer) {
            updateCanvas();
            return;
        }
        pageThumbnails = []; // 이미지 보관함 비우기
        await loadThumbnails();
        updateCanvas();
    }

    // 파일 선택 시 호출
    document.getElementById('pdfInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const arrayBuffer = await file.arrayBuffer();
        masterBuffer = arrayBuffer; // 원본 저장
        resetAndPreview();
    });

    // 필요한 페이지만큼 이미지로 변환 (미리보기용)
    async function loadThumbnails() {
        if (!masterBuffer || isProcessing) return;
        isProcessing = true;
        document.getElementById('statusMsg').innerText = "미리보기 생성 중...";

        const cols = parseInt(document.getElementById('cols').value) || 1;
        const rows = parseInt(document.getElementById('rows').value) || 1;
        const needed = cols * rows;

        try {
            // [핵심] .slice(0)를 사용하여 원본 masterBuffer를 보호함
            const loadingTask = pdfjsLib.getDocument({ data: masterBuffer.slice(0) });
            const pdf = await loadingTask.promise;
            const total = pdf.numPages;
            const limit = Math.min(needed, total);

            for (let i = 0; i < limit; i++) {
                const page = await pdf.getPage(i + 1);
                const viewport = page.getViewport({ scale: 0.3 });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await page.render({ canvasContext: ctx, viewport }).promise;
                
                pageThumbnails.push(canvas);
                updateCanvas(); // 한 장씩 나올 때마다 바로 화면 갱신
            }
        } catch (err) {
            console.error(err);
        } finally {
            isProcessing = false;
            document.getElementById('statusMsg').innerText = "";
        }
    }

    // 미리보기 화면 실제 그리기
    function updateCanvas() {
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const cols = parseInt(document.getElementById('cols').value) || 1;
        const rows = parseInt(document.getElementById('rows').value) || 1;
        const sizeKey = document.getElementById('pageSize').value;
        const direction = document.getElementById('direction').value;
        
        const [pW, pH] = SIZES[sizeKey].pt;
        const scale = 0.5; // 화면 표시 비율
        canvas.width = pW * scale;
        canvas.height = pH * scale;

        // 배경색
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cellW = canvas.width / cols;
        const cellH = canvas.height / rows;
        ctx.strokeStyle = "#e2e8f0";

        for (let i = 0; i < (cols * rows); i++) {
            let r, c;
            if (direction === 'horizontal') {
                r = Math.floor(i / cols);
                c = i % cols;
            } else {
                c = Math.floor(i / rows);
                r = i % rows;
            }
            const x = c * cellW;
            const y = r * cellH;

            // 격자 선
            ctx.strokeRect(x, y, cellW, cellH);

            // 이미지 있으면 넣기
            if (pageThumbnails[i]) {
                const img = pageThumbnails[i];
                const ratio = Math.min(cellW / img.width, cellH / img.height) * 0.9;
                const dw = img.width * ratio;
                const dh = img.height * ratio;
                ctx.drawImage(img, x + (cellW - dw)/2, y + (cellH - dh)/2, dw, dh);
            } else {
                ctx.fillStyle = "#cbd5e1";
                ctx.font = "10px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(i + 1, x + cellW/2, y + cellH/2);
            }
        }
    }

    // 실제 PDF 변환 및 다운로드
    async function generatePdf() {
        if (!masterBuffer) return alert("파일을 선택해주세요.");
        
        const btn = document.getElementById('generateBtn');
        btn.disabled = true;
        btn.innerText = "처리 중...";

        try {
            const outDoc = await PDFLib.PDFDocument.create();
            // [핵심] 여기서도 .slice(0)를 사용하여 원본을 절대 건드리지 않음
            const srcDoc = await PDFLib.PDFDocument.load(masterBuffer.slice(0));
            const pages = await outDoc.embedPages(srcDoc.getPages());
            
            const cols = parseInt(document.getElementById('cols').value);
            const rows = parseInt(document.getElementById('rows').value);
            const sizeKey = document.getElementById('pageSize').value;
            const direction = document.getElementById('direction').value;
            const [pW, pH] = SIZES[sizeKey].pt;

            const cellW = pW / cols;
            const cellH = pH / rows;
            const perSheet = cols * rows;

            let sheet;
            for (let i = 0; i < pages.length; i++) {
                if (i % perSheet === 0) sheet = outDoc.addPage([pW, pH]);

                const idx = i % perSheet;
                let r, c;
                if (direction === 'horizontal') {
                    r = Math.floor(idx / cols);
                    c = idx % cols;
                } else {
                    c = Math.floor(idx / rows);
                    r = idx % rows;
                }

                const p = pages[i];
                const s = Math.min(cellW / p.width, cellH / p.height) * 0.98;
                const dw = p.width * s;
                const dh = p.height * s;
                
                sheet.drawPage(p, {
                    x: (c * cellW) + (cellW - dw) / 2,
                    y: pH - ((r + 1) * cellH) + (cellH - dh) / 2,
                    width: dw,
                    height: dh
                });
            }

            const bytes = await outDoc.save();
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
            link.download = "result.pdf";
            link.click();
        } catch (err) {
            alert("다운로드 오류: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "PDF 다운로드";
        }
    }
    updateCanvas();
</script>
</body>
</html>
